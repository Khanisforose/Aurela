# Aurela nginx config for www.aurelawallet.com
# Lines starting with #SSL# are commented until certificate is obtained.
# After certbot succeeds, run:  sed -i 's/#SSL#//g' nginx/aurela.conf && docker compose restart nginx

server {
    listen 80;
    server_name aurelawallet.com www.aurelawallet.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Before SSL: proxy directly. After SSL enabled, we redirect to https.
#SSL#    return 301 https://www.aurelawallet.com$request_uri;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

