version: '3.9'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [aurela]

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
    depends_on: [mongo]
    networks: [aurela]
    expose: ["3000"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/aurela.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on: [web]
    networks: [aurela]

  # For obtaining certs use `certbot-run` (one-shot, no entrypoint override).
  # The `certbot` service below only handles auto-renew in a loop.
  certbot-run:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks: [aurela]

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks: [aurela]

volumes:
  mongo_data:

networks:
  aurela:
